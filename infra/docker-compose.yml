services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synapse_studio
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse-local-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - synapse-postgres-data:/var/lib/postgresql/data
      - ../apps/api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - synapse-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  synapse-postgres-data:
  synapse-redis-data:
