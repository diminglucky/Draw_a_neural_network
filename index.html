<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*" />
    <title>Synapse Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Synapse Studio</span></div>
        <div class="status" id="statusText">就绪</div>
      </header>

      <main class="stream" id="stream">
        <section class="welcome" id="welcomeBlock">
          <h1>描述你想绘制的神经网络</h1>
          <p class="sub">用自然语言描述、直接粘贴代码，或上传一张架构图。分析后自动绘制到 Visio。</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="画一个 ResNet50 的架构图，包含 4 个残差阶段和跳跃连接">ResNet50（残差连接）</button>
            <button class="suggestion" data-prompt="画一个 Transformer 编码器，包含多头注意力和前馈网络">Transformer（注意力）</button>
            <button class="suggestion" data-prompt="画一个 U-Net 医学图像分割网络，含编码器、解码器和跳跃连接">U-Net（分割）</button>
          </div>
        </section>
        <div class="messages" id="messages"></div>
      </main>

      <footer class="composer">
        <div class="composer-inner">
          <button class="attach" id="attachButton" title="上传架构图">＋</button>
          <div class="composer-fields">
            <div class="image-preview" id="imagePreview" hidden></div>
            <textarea id="input" rows="1" placeholder="描述网络结构，或粘贴代码……（Enter 发送，Shift+Enter 换行）"></textarea>
          </div>
          <button class="send" id="sendButton">发送</button>
        </div>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden />
      </footer>

      <button class="settings-toggle" id="settingsToggle" title="设置">⚙</button>
    </div>

    <aside class="settings-drawer" id="settingsDrawer" aria-hidden="true">
      <div class="settings-head"><h2>设置</h2><button class="close" id="closeSettings">×</button></div>
      <div class="settings-body">
        <section class="settings-group">
          <h3>LLM 分析</h3>
          <p class="hint">自然语言画图依赖大模型。也可用环境变量 LLM_BASE_URL / LLM_API_KEY / LLM_MODEL 作为初始值。</p>
          <label class="field">Base URL<input id="llmBaseUrlInput" type="text" placeholder="https://api.openai.com/v1" autocomplete="off" /></label>
          <label class="field">API Key<input id="llmApiKeyInput" type="password" placeholder="sk-..." autocomplete="off" /></label>
          <button class="primary outline" id="llmFetchModelsButton" type="button">拉取模型列表</button>
          <label class="field">模型<input id="llmModelInput" type="text" placeholder="先拉取，或手动输入模型名" list="llmModelList" autocomplete="off" /><datalist id="llmModelList"></datalist></label>
          <button class="primary" id="llmSaveButton">保存 LLM 配置</button>
          <p class="status-text" id="llmStatusText"></p>
        </section>
        <section class="settings-group">
          <h3>Visio 输出</h3>
          <p class="hint">必须指定一个已存在的 Visio 文档（.vsdx），图形通过原生 COM 写入。</p>
          <label class="field">Visio 文档路径<input id="visioDocumentPathInput" type="text" placeholder="C:\项目\model.vsdx" /></label>
          <label class="field">页面名称<input id="visioPageInput" type="text" value="Page-1" /></label>
          <button class="primary" id="visioSaveButton">保存 Visio 配置</button>
          <p class="status-text" id="visioStatusText"></p>
        </section>
      </div>
    </aside>
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
